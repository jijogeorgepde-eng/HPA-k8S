apiVersion: apps/v1
kind: Deployment
metadata:
  name: spread-demo
  namespace: jfoods
spec:
  replicas: 4
  selector:
    matchLabels:
      app: spread-demo
  template:
    metadata:
      labels:
        app: spread-demo
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
